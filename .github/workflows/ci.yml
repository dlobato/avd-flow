name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v

  build-example:
    name: Build example (AVD ${{ matrix.avd }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        avd: ["6.0.0", "6.0.1", "6.1.0", "6.2.0", "6.3.0", "6.4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv run avd-flow build --sanitize --avd-version ${{ matrix.avd }} --inventory examples/single-dc-l3ls/inventory.yml
        env:
          BUILD_OUTPUT_DIR: ${{ github.workspace }}/example-build
      - uses: actions/upload-artifact@v4
        with:
          name: configs-${{ matrix.os }}-avd-${{ matrix.avd }}
          path: example-build/intended/configs/*.cfg
          if-no-files-found: error
