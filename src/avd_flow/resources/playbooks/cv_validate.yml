---
- name: Validate configurations with CloudVision
  hosts: "{{ lookup('ansible.builtin.env', 'FABRIC_INVENTORY_GROUP', default='FABRIC') }}"
  connection: local
  gather_facts: false
  tasks:
    - name: Create workspace for validation
      run_once: true # noqa: run-once[task]
      delegate_to: localhost
      arista.avd.cv_workflow:
        cv_servers: "{{ lookup('ansible.builtin.env', 'CV_DEPLOY_SERVER', default=Undefined) }}"
        cv_token: "{{ lookup('ansible.builtin.env', 'CV_DEPLOY_TOKEN', default=Undefined) }}"
        cv_verify_certs: "{{ lookup('ansible.builtin.env', 'CV_VERIFY_CERTS', default=true) | bool }}"
        configuration_dir: "{{ inventory_dir }}/intended/configs"
        structured_config_dir: "{{ inventory_dir }}/intended/structured_configs"
        device_list: "{{ ansible_play_hosts }}"
        workspace:
          id: "{{ lookup('ansible.builtin.env', 'WORKSPACE_ID', default=Undefined) }}"
          name: "{{ lookup('ansible.builtin.env', 'WORKSPACE_NAME', default=Undefined) }}"
          description: "{{ lookup('ansible.builtin.env', 'WORKSPACE_DESCRIPTION') }}"
          requested_state: "{{ lookup('ansible.builtin.env', 'WORKSPACE_REQUESTED_STATE', default='abandoned') }}"
